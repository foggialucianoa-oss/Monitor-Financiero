name: Daily Morning Briefing

on:
  schedule:
    - cron: '0 11 * * 1-5' # Lunes a Viernes a las 08:00 AM hora Argentina
  workflow_dispatch: # Permite ejecución manual inmediata

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance feedparser google-genai requests xhtml2pdf curl_cffi matplotlib

      - name: Ejecutar script de Morning Brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python morning_brief.py
